<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Private Code Sync — Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>Private Code Sync</h1>
  <p class="hint">
    Your token is stored only in this browser's local extension storage
    (<code>chrome.storage.local</code>). It is sent to one place:
    <code>api.github.com</code>. Nothing else, ever.
  </p>

  <label>
    GitHub Personal Access Token
    <span class="sub">fine-grained, scoped to your repos, "Contents: Read and write" only</span>
    <input type="password" id="token" placeholder="github_pat_..." autocomplete="off" />
  </label>

  <label>
    LeetCode repo
    <span class="sub">format: yourname/leetcode-solutions</span>
    <input type="text" id="lcRepo" placeholder="yourname/leetcode-solutions" />
  </label>

  <label>
    GFG repo
    <span class="sub">format: yourname/gfg-solutions</span>
    <input type="text" id="gfgRepo" placeholder="yourname/gfg-solutions" />
  </label>

  <button id="save">Save</button>
  <p id="status"></p>

  <script src="options.js"></script>
</body>
</html>
